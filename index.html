<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XYStation · 个人作品站</title>
    <meta name="description" content="XYStation 个人作品站 — 进入车站，查看停靠中的项目。" />
    <script>
      try {
        var t = localStorage.getItem("xystation-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=shown2" />
  </head>
  <body class="is-boot">
    <canvas id="view" aria-hidden="true"></canvas>
    <div class="glow" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <canvas id="ash" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <header class="hud">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        XYSTATION
      </div>
      <div class="hud-right">
        <button id="theme" class="theme-switch" type="button" aria-pressed="true" aria-label="当前暗色，切换亮色">
          <span class="theme-light">亮</span>
          <span class="theme-sep" aria-hidden="true">/</span>
          <span class="theme-dark">暗</span>
        </button>
        <span id="clock">00:00:00</span>
        <span class="hud-line">STATION 01</span>
      </div>
    </header>

    <section id="boot" class="layer boot">
      <div class="boot-core">
        <p class="boot-text">正在进站</p>
        <p class="boot-pct" id="pct">0%</p>
      </div>
    </section>

    <section id="gate" class="layer gate" aria-hidden="true">
      <p class="kicker gate-ui">GODTALK · PERSONAL STATION · 2026</p>
      <h1 class="fly-title"><span class="fly-pop">XYSTATION</span></h1>
      <button id="enter" class="gate-ui" type="button">
        <span>向上滚动进入站台</span>
        <strong>SCROLL UP</strong>
      </button>
      <p id="media-load" class="media-load" hidden>图片 0%</p>
    </section>

    <section id="station" class="layer station" aria-hidden="true">
      <p class="platform-tag">站台开放中 · 靠近站点时文字与图片会浮现</p>

      <button class="beacon" type="button" data-id="resume">
        <i></i><span>CV 简历</span>
      </button>
      <button class="beacon" type="button" data-id="software">
        <i></i><span>SW 软件</span>
      </button>
      <button class="beacon" type="button" data-id="works">
        <i></i><span>WK 原画作品</span>
      </button>
      <button class="beacon" type="button" data-id="blender">
        <i></i><span>BL Blender</span>
      </button>
      <button class="beacon" type="button" data-id="unity">
        <i></i><span>UN Unity</span>
      </button>
      <button class="beacon" type="button" data-id="tools">
        <i></i><span>TL 工具</span>
      </button>
      <button class="beacon" type="button" data-id="contact">
        <i></i><span>CT 联系方式</span>
      </button>
    </section>

    <nav class="rail" id="rail" aria-label="站台导航">
      <p class="rail-kicker">Index</p>
      <p class="rail-now" id="rail-now"><span class="rail-long">00 本站入口</span><span class="rail-short">00 入口</span></p>
      <div class="rail-list">
        <button type="button" class="rail-item" data-go="gate">
          <i></i><em>00</em><span class="rail-long">本站入口</span><span class="rail-short">入口</span>
        </button>
        <span class="rail-seg" data-from="gate" aria-hidden="true"></span>
        <button type="button" class="rail-item" data-id="resume">
          <i></i><em>CV</em><span class="rail-long">个人简历</span><span class="rail-short">简历</span>
        </button>
        <span class="rail-seg" data-from="resume" aria-hidden="true"></span>
        <button type="button" class="rail-item" data-id="software">
          <i></i><em>SW</em><span class="rail-long">常用软件</span><span class="rail-short">软件</span>
        </button>
        <span class="rail-seg" data-from="software" aria-hidden="true"></span>
        <button type="button" class="rail-item" data-id="works">
          <i></i><em>WK</em><span class="rail-long">原画作品</span><span class="rail-short">原画</span>
        </button>
        <span class="rail-seg" data-from="works" aria-hidden="true"></span>
        <button type="button" class="rail-item" data-id="blender">
          <i></i><em>BL</em><span class="rail-long">Blender效果</span><span class="rail-short">Blender</span>
        </button>
        <span class="rail-seg" data-from="blender" aria-hidden="true"></span>
        <button type="button" class="rail-item" data-id="unity">
          <i></i><em>UN</em><span class="rail-long">Unity效果</span><span class="rail-short">UNITY</span>
        </button>
        <span class="rail-seg" data-from="unity" aria-hidden="true"></span>
        <button type="button" class="rail-item" data-id="tools">
          <i></i><em>TL</em><span class="rail-long">工具研发</span><span class="rail-short">工具</span>
        </button>
        <span class="rail-seg" data-from="tools" aria-hidden="true"></span>
        <button type="button" class="rail-item" data-id="contact">
          <i></i><em>CT</em><span class="rail-long">联系方式</span><span class="rail-short">联系</span>
        </button>
      </div>
    </nav>

    <div id="peek" class="peek" hidden>
      <button class="peek-mask" type="button" aria-label="关闭作品"></button>
      <figure class="peek-frame">
        <img id="peek-img" alt="" />
        <video id="peek-video" playsinline controls preload="auto"></video>
        <p class="peek-wait" id="peek-wait" hidden>片子进站加载中</p>
        <figcaption id="peek-cap"></figcaption>
      </figure>
    </div>

    <script type="module" src="js/main.js?v=mp4case"></script>
  </body>
</html>
