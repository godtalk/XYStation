<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XYStation · 个人作品站</title>
    <meta name="description" content="XYStation 个人作品站 — 进入车站，查看停靠中的项目。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="is-boot">
    <canvas id="view" aria-hidden="true"></canvas>
    <div class="glow" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="hud">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        XYSTATION
      </div>
      <div class="hud-right">
        <span id="clock">00:00:00</span>
        <span class="hud-line">STATION 01</span>
      </div>
    </header>

    <section id="boot" class="layer boot">
      <div class="boot-core">
        <span class="mark lg" aria-hidden="true"></span>
        <p class="boot-text">正在进站......</p>
        <p class="boot-pct" id="pct">0%</p>
      </div>
    </section>

    <section id="gate" class="layer gate" aria-hidden="true">
      <p class="kicker gate-ui">GODTALK · PERSONAL STATION · 2026</p>
      <h1 class="fly-title">XYSTATION</h1>
      <button id="enter" class="gate-ui" type="button">
        <span>滚动滚轮推移镜头</span>
        <strong>SCROLL</strong>
      </button>
    </section>

    <section id="station" class="layer station" aria-hidden="true">
      <p class="platform-tag">站台开放中 · 点击信标查看</p>

      <button class="beacon" type="button" data-id="w1" data-x="24" data-y="38">
        <i></i><span>XY-01 本站</span>
      </button>
      <button class="beacon" type="button" data-id="w2" data-x="62" data-y="30">
        <i></i><span>XY-02 待发</span>
      </button>
      <button class="beacon" type="button" data-id="w3" data-x="46" data-y="58">
        <i></i><span>XY-03 实验</span>
      </button>
      <button class="beacon" type="button" data-id="about" data-x="18" data-y="68">
        <i></i><span>关于</span>
      </button>
      <button class="beacon" type="button" data-id="contact" data-x="74" data-y="60">
        <i></i><span>联络</span>
      </button>
    </section>

    <aside id="dossier" class="dossier" hidden>
      <button class="dossier-close" type="button" id="close">关闭</button>
      <p class="dossier-code" id="d-code"></p>
      <h2 id="d-title"></h2>
      <p class="dossier-meta" id="d-meta"></p>
      <div class="dossier-body" id="d-body"></div>
    </aside>

    <nav class="side" aria-label="快捷">
      <button type="button" data-id="w1">作品</button>
      <button type="button" data-id="about">关于</button>
      <button type="button" data-id="contact">联络</button>
    </nav>

    <script src="js/main.js"></script>
  </body>
</html>
